<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#7aafe3,#4376b8);
    font-family:'Poppins',sans-serif;
    box-sizing:border-box;
}

.success-box{
    background:#fff;
    padding:45px 35px;
    border-radius:25px;
    width:100%;
    max-width:500px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
    animation:cardAppear .8s ease forwards;
}

.success-icon{
    width:100px;
    height:100px;
    margin:0 auto 20px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:50px;
    animation:pulse 2s infinite;
}

.success-box h2{
    font-size:32px;
    margin-bottom:15px;
    color:#111827;
}

.success-box p{
    font-size:16px;
    line-height:1.7;
    color:#6b7280;
}

.btn-home{
    display:inline-block;
    padding:12px 30px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.btn-home:hover{
    color:#fff;
    transform:translateY(-3px);
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

/* Tablet */
@media (max-width: 768px){
    .success-box{
        padding:35px 25px;
    }

    .success-icon{
        width:85px;
        height:85px;
        font-size:42px;
    }

    .success-box h2{
        font-size:26px;
    }

    .success-box p{
        font-size:15px;
    }
}

/* Mobile */
@media (max-width: 480px){
    body{
        padding:15px;
    }

    .success-box{
        padding:30px 20px;
        border-radius:20px;
    }

    .success-icon{
        width:75px;
        height:75px;
        font-size:36px;
        margin-bottom:15px;
    }

    .success-box h2{
        font-size:22px;
        line-height:1.3;
    }

    .success-box p{
        font-size:14px;
        line-height:1.6;
    }

    .btn-home{
        width:100%;
        padding:14px;
        font-size:15px;
    }
}
    </style>

    <script>
  fbq('track', 'Purchase');
</script>
</head>
<body>

<div class="success-box">
   <div class="success-icon">
    <i class="fas fa-check"></i>
</div>

    <h2 class="mt-3">Order Placed Successfully!</h2>

    <p>
        Thank you for your order. Your parcel will be delivered within 3 to 4 working days.
    </p>

    <a href="index.html#products" class="btn-home">
        Continue Shopping
    </a>
</div>

</body>
</html>
